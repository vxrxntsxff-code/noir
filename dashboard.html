<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Личный кабинет — NOIR</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body::before, body::after, .grain, .float-cta, .mobile-menu, .burger { display: none !important; }
    html { overflow-y: scroll; }
    :root {
      --success: #82C99A;
      --surface2: #1A1A1E;
      --warn: #FF9800;
    }
    #nav {
      background: rgba(11,11,13,.95) !important;
      border-bottom: 1px solid var(--border) !important;
    }
    #nav.scrolled {
      background: rgba(11,11,13,.95) !important;
    }
    #app { padding-top: 72px; }
    .dash-container{max-width:1000px;margin:0 auto;padding:24px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    @media(max-width:768px){.grid{grid-template-columns:1fr}}
    .card{
      background:var(--surface);border:1px solid var(--border);
      border-radius:20px;padding:28px;
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
      transition: box-shadow .3s ease, transform .3s ease;
    }
    .card:hover {
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      transform: translateY(-2px);
    }
    .card-title{font-size:14px;color:var(--muted);margin-bottom:16px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600}
    .stat-value{font-family:var(--font-display);font-size:32px;font-weight:600;color:var(--text)}
    .stat-label{font-size:13px;color:var(--muted);margin-top:4px}
    .progress-bar{
      height:8px;background:var(--border);border-radius:9999px;overflow:hidden;margin:16px 0;
    }
    .progress-fill{height:100%;background:linear-gradient(90deg, var(--accent), #d4b87a);border-radius:9999px;transition:width .5s}
    .progress-text{font-size:13px;color:var(--muted);text-align:right}
    .timeline{list-style:none}
    .timeline li{
      display:flex;gap:16px;padding:14px 0;
      border-bottom:1px solid var(--border);font-size:14px;
      border-radius:12px;margin:4px 0;padding:14px 12px;
      transition: background .2s;
    }
    .timeline li:hover{background:rgba(255,255,255,.02)}
    .timeline li:last-child{border-bottom:none}
    .timeline .dot{
      width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:4px;
    }
    .dot-done{background:var(--success)}
    .dot-current{background:var(--accent);box-shadow:0 0 8px var(--accent)}
    .dot-pending{background:var(--border)}
    .timeline .label{flex:1}
    .timeline .date{color:var(--muted);font-size:12px}
    .doc-list{list-style:none}
    .doc-list li{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 12px;margin:4px 0;border-bottom:none;font-size:14px;
      background:rgba(255,255,255,.02);border-radius:12px;
      transition: background .2s;
    }
    .doc-list li:hover{background:rgba(255,255,255,.04)}
    .doc-link{color:var(--accent);text-decoration:none;font-weight:500;padding:6px 12px;border:1px solid var(--accent);border-radius:9999px;font-size:13px;transition:all .2s}
    .doc-link:hover{background:var(--accent);color:#161310;text-decoration:none}
    .payment-row{
      display:flex;justify-content:space-between;align-items:center;
      padding:14px 12px;margin:4px 0;border-bottom:none;font-size:14px;
      background:rgba(255,255,255,.02);border-radius:12px;
    }
    .payment-row:hover{background:rgba(255,255,255,.04)}
    .payment-amount{font-weight:600;font-family:var(--font-display)}
    .empty{text-align:center;color:var(--muted);padding:32px;font-size:14px}
    .login-card{
      max-width:400px;margin:120px auto 80px;background:var(--surface);
      border:1px solid var(--border);border-radius:24px;padding:40px;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
    }
    .login-title{font-family:var(--font-display);font-size:22px;font-weight:600;text-align:center;margin-bottom:8px}
    .login-sub{color:var(--muted);text-align:center;margin-bottom:24px;font-size:14px}
    .input{
      width:100%;padding:14px 18px;background:var(--surface2);border:1px solid var(--border);
      border-radius:12px;color:var(--text);font-size:14px;outline:none;
      transition:border-color .2s;
    }
    .input:focus{border-color:var(--accent)}
    .input::placeholder{color:var(--muted)}
    .login-card .btn{
      display:block;width:100%;padding:14px;border:none;border-radius:9999px;
      font-size:16px;font-weight:600;cursor:pointer;text-align:center;
      text-decoration:none;transition:all .2s;margin-top:16px;
    }
    .login-card .btn-primary{background:var(--accent);color:#161310}
    .login-card .btn-primary:hover{background:#d4b87a;transform:translateY(-1px)}
    .note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
    .full-width{grid-column:1/-1}
  </style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
</head>
<body>
  <header id="nav">
    <div class="container nav-inner">
      <a href="/" class="logo">NOIR<span>®</span></a>
      <nav class="nav-links" aria-label="Навигация">
        <a class="nav-link" href="/">Главная</a>
        <a class="nav-link" href="/tech">Технологии</a>
        <a class="btn btn-primary btn-sm" href="/#contact">Рассчитать проект</a>
      </nav>
    </div>
  </header>

  <div id="app">
    <div id="dash-error" role="alert" style="display:none;max-width:1000px;margin:16px auto 0;padding:14px 18px;background:rgba(255,60,60,.1);border:1px solid rgba(255,60,60,.4);border-radius:12px;color:#ff8a8a;font-size:14px"></div>
    <div class="dash-container" id="dashboard" style="display:none">
      <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
        <button id="dash-logout" class="doc-link" type="button" style="background:transparent;cursor:pointer">Выйти</button>
      </div>
      <div class="grid stagger-children">
        <div class="card fade-in-up">
          <div class="card-title">Прогресс проекта</div>
          <div class="stat-value" id="project-name">—</div>
          <div class="stat-label" id="project-package"></div>
          <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
          <div class="progress-text" id="progress-text">0%</div>
        </div>

        <div class="card fade-in-up">
          <div class="card-title">Оплата</div>
          <div class="stat-value" id="payment-total">—</div>
          <div class="stat-label">Общая стоимость</div>
          <div style="margin-top:16px">
            <div style="display:flex;justify-content:space-between;font-size:14px;padding:8px 0">
              <span style="color:var(--muted)">Оплачено</span>
              <span id="payment-paid" style="color:var(--success)">—</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:14px;padding:8px 0">
              <span style="color:var(--muted)">Остаток</span>
              <span id="payment-remaining" style="color:var(--warn)">—</span>
            </div>
          </div>
        </div>

        <div class="card full-width">
          <div class="card-title">Таймлайн</div>
          <ul class="timeline" id="timeline"></ul>
        </div>

        <div class="card fade-in-up">
          <div class="card-title">Документы</div>
          <ul class="doc-list" id="docs"></ul>
        </div>

        <div class="card fade-in-up">
          <div class="card-title">История оплат</div>
          <div id="payments"></div>
        </div>

        <div class="card full-width">
          <div class="card-title">Последние обновления</div>
          <div id="updates"></div>
        </div>
      </div>
    </div>

    <div id="login-view" style="display:none">
      <div class="login-card">
        <div class="login-title">Личный кабинет</div>
        <div class="login-sub">Войдите по номеру телефона или Telegram</div>
        <input class="input" id="login-input" placeholder="Телефон или @username" autocomplete="off">
        <button class="btn btn-primary" id="login-btn">Войти</button>
      </div>
    </div>
  </div>

  <script src="/dashboard.js"></script>
</body>
</html>
